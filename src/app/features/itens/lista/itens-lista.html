<div class="itens-lista">
  <div class="itens-header">
    <h1>Itens</h1>
    <button mat-flat-button color="primary" routerLink="novo" *ngIf="podeGerenciar()">
      <mat-icon>add</mat-icon>
      Novo item
    </button>
  </div>

  <mat-tab-group (selectedIndexChange)="mudarAba($event)">
    <mat-tab label="Todos"></mat-tab>
    <mat-tab label="Críticos"></mat-tab>
    <mat-tab label="Vencendo"></mat-tab>
  </mat-tab-group>

  <form class="itens-filtros" *ngIf="aba() === 'todos'" (ngSubmit)="aplicarFiltros()">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput name="busca" [(ngModel)]="busca" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select name="status" [(ngModel)]="status">
        <mat-option value="">Todos</mat-option>
        <mat-option value="CRITICO">Crítico</mat-option>
        <mat-option value="ATENCAO">Atenção</mat-option>
        <mat-option value="NORMAL">Normal</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoria</mat-label>
      <input matInput name="categoria" [(ngModel)]="categoria" />
    </mat-form-field>

    <button mat-stroked-button type="submit">Filtrar</button>
  </form>

  @if (carregando()) {
    <p>Carregando…</p>
  } @else {
    <table mat-table [dataSource]="itens()" class="itens-tabela">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let item">{{ item.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let item">{{ item.categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="quantidadeAtual">
        <th mat-header-cell *matHeaderCellDef>Quantidade</th>
        <td mat-cell *matCellDef="let item">{{ item.quantidadeAtual }} {{ item.unidadeMedida }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let item"><app-status-tag [status]="item.status" /></td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item">
          <a mat-icon-button [routerLink]="[item.id]" *ngIf="podeGerenciar()" aria-label="Editar item">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="excluir(item)" *ngIf="podeExcluir()" aria-label="Excluir item">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    <p *ngIf="!itens().length">Nenhum item encontrado.</p>

    <mat-paginator
      *ngIf="aba() === 'todos'"
      [length]="totalElementos()"
      [pageSize]="tamanho()"
      [pageIndex]="pagina()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="mudarPagina($event)"
    />
  }
</div>
