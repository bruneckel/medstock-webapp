<mat-sidenav-container class="shell">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile() || menuMobileAberto()"
    (closed)="fecharMenuMobile()"
    class="shell-sidenav"
    [class.shell-sidenav--colapsado]="!isMobile() && colapsado()"
  >
    <div class="shell-brand-row">
      @if (isMobile() || !colapsado()) {
        <div class="shell-brand">Smart HAS</div>
      }
      @if (!isMobile()) {
        <button
          mat-icon-button
          (click)="alternarColapso()"
          [attr.aria-label]="colapsado() ? 'Expandir menu' : 'Recolher menu'"
        >
          <mat-icon>{{ colapsado() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
      }
    </div>
    <mat-nav-list>
      <ng-container *ngFor="let item of itensDeNavegacao">
        <a
          *ngIf="podeVer(item)"
          mat-list-item
          [routerLink]="item.rota"
          routerLinkActive="shell-nav-item--ativo"
          [attr.aria-label]="item.rotulo"
          (click)="fecharMenuMobile()"
        >
          <mat-icon matListItemIcon>{{ item.icone }}</mat-icon>
          @if (isMobile() || !colapsado()) {
            <span matListItemTitle>{{ item.rotulo }}</span>
          }
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-topbar">
      @if (isMobile()) {
        <button
          mat-icon-button
          (click)="alternarMenuMobile()"
          [attr.aria-label]="menuMobileAberto() ? 'Fechar menu' : 'Abrir menu'"
          [attr.aria-expanded]="menuMobileAberto()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="shell-spacer"></span>
      <button
        mat-icon-button
        [disabled]="theme.isAnimating()"
        (click)="theme.toggleTheme($event)"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      >
        <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      @if (usuario(); as usuarioAtual) {
        <button mat-button [matMenuTriggerFor]="menuUsuario">
          {{ usuarioAtual.nome }}
          <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #menuUsuario="matMenu">
          <div class="shell-perfil">{{ usuarioAtual.perfil }}</div>
          <button mat-menu-item (click)="sair()">
            <mat-icon>logout</mat-icon>
            Sair
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
